name: Fetch official OpenRadioss release

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-openradioss.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest official Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo OpenRadioss/OpenRadioss --limit 5
          TAG=$(gh release list --repo OpenRadioss/OpenRadioss --limit 1 --json tagName -q '.[0].tagName')
          echo "Using tag $TAG"
          gh release view "$TAG" --repo OpenRadioss/OpenRadioss --json tagName,publishedAt,url,assets > release.json
          head -c 3000 release.json; echo
          gh release download "$TAG" --repo OpenRadioss/OpenRadioss --pattern 'OpenRadioss_linux64.zip'
          sha256sum OpenRadioss_linux64.zip | tee OpenRadioss_linux64.zip.sha256
          ls -l
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openradioss-linux64
          path: |
            OpenRadioss_linux64.zip
            OpenRadioss_linux64.zip.sha256
            release.json
          retention-days: 30
