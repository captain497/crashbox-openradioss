name: Fetch official OpenRadioss release

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-openradioss.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest official Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo OpenRadioss/OpenRadioss --json tagName,publishedAt,assets \
            > release.json
          cat release.json | head -c 2000
          gh release download --repo OpenRadioss/OpenRadioss --pattern 'OpenRadioss_linux64.zip'
          sha256sum OpenRadioss_linux64.zip | tee OpenRadioss_linux64.zip.sha256
          ls -l
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openradioss-linux64
          path: |
            OpenRadioss_linux64.zip
            OpenRadioss_linux64.zip.sha256
            release.json
          retention-days: 30
