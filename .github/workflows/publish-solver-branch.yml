name: Copy built solver to the solver-bin branch
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        default: "45562977905"
permissions:
  contents: write
  actions: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openradioss-linux64-gf
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - run: |
          sha256sum -c openradioss_linux64_gf.tgz.sha256
          git init -q b && cd b && git checkout -q --orphan solver-bin
          cp ../openradioss_linux64_gf.tgz* .
          echo "From build run ${{ inputs.build_run_id }}" > README.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Solver build from run ${{ inputs.build_run_id }}"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} solver-bin
