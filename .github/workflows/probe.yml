name: Probe OpenRadioss location
on:
  push:
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in xupeiwust/OpenRadioss_extlib AgenteScontro/devci_OpenRadioss_extlib; do
            echo "=== $r"
            gh api "repos/$r" --jq '.default_branch,.pushed_at'
            br=$(gh api repos/$r --jq .default_branch)
            gh api "repos/$r/git/trees/$br?recursive=1" --jq '.tree[]|select(.type=="blob")|.path+" "+(.size|tostring)' | grep -v "boost/boost_1_70_0/boost/" | awk '{split($1,a,"/"); k=a[1]"/"a[2]"/"a[3]; c[k]++; s[k]+=$2} END{for(k in c) print k, c[k], s[k]}' | sort
            gh api repos/$r/contents/EXTLIB_VERSION.json?ref=$br --jq .content | base64 -d
          done
          gh api repos/xupeiwust/OpenRadioss_extlib/contents/.github/workflows/deliv_extlib_openradioss_ci.yaml --jq .content | base64 -d | head -400
