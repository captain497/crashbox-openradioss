name: Probe OpenRadioss location
on:
  push:
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/xupeiwust/OpenRadioss_extlib/git/trees/main?recursive=1" --jq '.tree[]|select(.type=="blob")|.path+" "+(.size|tostring)' | head -80
          gh api repos/xupeiwust/OpenRadioss_extlib/commits?per_page=5 --jq '.[]|.sha[:10]+" "+.commit.committer.date+" "+.commit.message[:60]'
          gh api -X GET search/repositories -f q='OpenRadioss_extlib' --jq '.items[]|.full_name+" "+.pushed_at'
          gh api -X GET search/repositories -f q='openradioss linux64 binaries' --jq '.items[:10][]|.full_name+" "+.pushed_at'
          for r in $(gh api -X GET search/repositories -f q='OpenRadioss_extlib' --jq '.items[].full_name'); do echo "== $r"; gh release list -R $r --limit 3 || true; done
          for r in lililii124/openradioss-261001; do gh release view upstream-20260929 -R $r --json assets --jq '.assets[]|.name+" "+(.size|tostring)'; done
